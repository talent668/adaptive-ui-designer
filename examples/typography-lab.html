$$('[data-locale]').forEach(b=>b.addEventListener('click',()=>{locale=b.dataset.locale;$$('[data-locale]').forEach(x=>x.setAttribute('aria-pressed',x===b));renderText();resetReading()}));
$('#leading').addEventListener('input',updateReading);$('#measure').addEventListener('input',updateReading);
$('#theme').addEventListener('click',()=>{const dark=root.dataset.theme!=='dark';root.dataset.theme=dark?'dark':'light';$('#theme').setAttribute('aria-pressed',dark);$('#theme').textContent=dark?'切换日间':'切换夜间'});
$('#stress').addEventListener('click',()=>{stress=!stress;$('#stress').setAttribute('aria-pressed',stress);for(const id of ['#goodPaper','#readerPaper'])$(id).classList.toggle('stress',stress);$('#profileNote').textContent=notes[root.dataset.typeProfile]+(stress?' 当前开启间距压力测试，字号不变。':'')});
$('#tabular').addEventListener('click',()=>{const active=$('#numbers').dataset.tabular!=='true';$('#numbers').dataset.tabular=String(active);$('#tabular').setAttribute('aria-pressed',active);$('#tabular').textContent=active?'等宽数字：开':'等宽数字：关'});
$('#closeReader').addEventListener('click',()=>$('#reader').close());
$('#reader').addEventListener('click',e=>{if(e.target===$('#reader')){const r=e.target.getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)e.target.close()}});
window.addEventListener('resize',updateScale);renderText();refreshProfile();
</script></body></html>
